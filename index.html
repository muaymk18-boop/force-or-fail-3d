const clock=new THREE.Clock(),parts=[],ray=new THREE.Raycaster(),mp=new THREE.Vector2();
const tint=(i,c)=>{const u=gates[i].userData;u.m.color.setHex(c);u.m.emissive.setHex(c);u.pane.material.color.setHex(c)};
function burst(p,c){for(let i=0;i<50;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.18),new THREE.MeshBasicMaterial({color:c}));m.position.set(p.x+(Math.random()-.5)*2,Math.random()*3,p.z);m.userData.v=new THREE.Vector3((Math.random()-.5)*6,Math.random()*6,Math.random()*6+2);m.userData.l=1.2;S.add(m);parts.push(m)}}
function start(){idx=0;score=0;log=[];$("score").textContent=0;show("start",0);show("result",0);show("hud",1);render()}
function render(){clearInterval(tid);const q=questions[idx];locked=false;tl=20;st="idle";vz=0;shake=0;cart.position.set(0,0,5);gates.forEach((g,i)=>{g.visible=true;tint(i,COL[i])});
$("rn").textContent=q.roundName;$("qc").textContent=`ข้อ ${idx+1}/${questions.length}`;$("qt").textContent=q.q;$("tm").textContent="⏱ "+tl;$("tm").classList.remove("low");$("phys").textContent="";show("fb",0);show("ans",1);
const a=$("ans");a.innerHTML="";q.opts.forEach((o,i)=>{const b=document.createElement("button");b.className="ans";b.innerHTML=`<i>${L[i]}</i><span>${o}</span>`;b.onclick=()=>choose(i);a.appendChild(b)});
tid=setInterval(()=>{tl--;$("tm").textContent="⏱ "+tl;if(tl<=5)$("tm").classList.add("low");if(tl<=0)choose(-1)},1000)}
function choose(c){if(locked)return;locked=true;clearInterval(tid);const q=questions[idx],ok=c===q.a;
document.querySelectorAll("button.ans").forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("ok");if(i===c&&!ok)b.classList.add("no")});
if(ok)score+=10;$("score").textContent=score;log.push({q,ok});res={ok,c};tgt=c;vz=0;if(c<0){st="done";finish()}else st="go"}
function hit(){cart.position.z=GZ+1.4;if(res.ok){burst(gates[tgt].position,COL[tgt]);gates[tgt].visible=false;vz=-18;shake=.4}else{tint(tgt,0xff667d);vz=7;shake=.7}st="slide"}
function finish(){const q=questions[idx],{ok,c}=res;tint(q.a,0x54e39a);if(!ok&&c>=0)tint(c,0xff667d);
$("fb").className="card "+(ok?"good":"bad");show("ans",0);show("fb",1);
$("fbt").textContent=ok?"⚡ จังหวะเยี่ยม! +10 คะแนน":c<0?"⏰ หมดเวลา! ไม่มีแรงผลัก รถจึงอยู่นิ่ง (กฎข้อ 1)":"💥 ชนแล้วเด้งกลับ! แรงปฏิกิริยาจากประตู (กฎข้อ 3)";
$("fbe").innerHTML=(ok?"":`<b>เฉลย: ${L[q.a]}. ${q.opts[q.a]}</b><br>`)+q.ex;$("nx").textContent=idx===questions.length-1?"ดูผลคะแนน 🏁":"ข้อต่อไป →"}
function results(){show("hud",0);show("fb",0);show("result",1);$("fs").textContent=score;let t,d;
if(score>=90){t="🏆 FORCE MASTER";d="ยอดเยี่ยม! คุณเชื่อมโยงกฎของนิวตันกับสถานการณ์จริงได้อย่างเฉียบคม"}else if(score>=70){t="⚡ FORCE HERO";d="ทำได้ดีมาก! ทบทวนคำอธิบายอีกนิด แล้วคุณจะเก่งขึ้นอีก"}else if(score>=50){t="🧠 RISING THINKER";d="เริ่มจับหลักได้แล้ว ลองทบทวนแรงลัพธ์ ความเฉื่อย และแรงคู่กิริยา–ปฏิกิริยา"}else{t="🔧 TRAINING MODE";d="ทุกข้อที่พลาดคือโอกาสเรียนรู้ อ่านเฉลยแล้วลองเล่นใหม่อีกครั้ง!"}
$("rt").textContent=t;$("rx").textContent=d;$("rl").innerHTML=log.map((r,i)=>`<div><b style="color:${r.ok?"#54e39a":"#ff667d"}">ข้อ ${i+1} ${r.ok?"✓":"✗"}</b> ${r.q.q}<br><span style="color:#a9b7d5">เฉลย: ${L[r.q.a]}. ${r.q.opts[r.q.a]}</span></div>`).join("")}
$("sb").onclick=start;$("rb").onclick=start;$("nx").onclick=()=>{idx++;idx>=questions.length?results():render()};
function pick(e){const r=R.domElement.getBoundingClientRect();mp.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mp,cam);const h=ray.intersectObjects(gates.filter(g=>g.visible),true).find(x=>x.object.userData.gate!==undefined);return h?h.object.userData.gate:-1}
R.domElement.addEventListener("pointermove",e=>{R.domElement.style.cursor=!locked&&pick(e)>=0?"pointer":"default"});
R.domElement.addEventListener("pointerdown",e=>{if(locked||st!=="idle")return;const i=pick(e);if(i>=0)choose(i)});
addEventListener("keydown",e=>{const k=Math.max("ABCD".indexOf(e.key.toUpperCase()),"1234".indexOf(e.key));if(k>=0&&!locked&&st==="idle")choose(k)});
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<1?78:60;cam.updateProjectionMatrix()}addEventListener("resize",resize);resize();
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
gates.forEach((g,i)=>g.userData.lb.position.y=4.1+Math.sin(t*2+i)*.12);
if(st==="idle")cart.position.y=Math.sin(t*3)*.04;
if(st==="go"){vz-=A*dt;cart.position.z+=vz*dt;cart.position.x+=(GX[tgt]-cart.position.x)*Math.min(1,dt*4);$("phys").textContent=`a = F/m • v = ${Math.abs(vz).toFixed(1)} m/s`;if(cart.position.z<=GZ+1.4)hit()}
else if(st==="slide"){cart.position.z+=vz*dt;vz*=1-dt*3;if(Math.abs(vz)<.5){st="done";$("phys").textContent="";finish()}}
for(let i=parts.length-1;i>=0;i--){const p=parts[i],u=p.userData;u.v.y-=12*dt;p.position.addScaledVector(u.v,dt);u.l-=dt;p.scale.setScalar(Math.max(u.l,0));if(u.l<=0){S.remove(p);parts.splice(i,1)}}
const cx=cart.position.x*.35;cam.position.set(cx+(Math.random()-.5)*shake,4.2+(Math.random()-.5)*shake,11);cam.lookAt(cx*.6,1.6,-4);shake*=1-dt*4;R.render(S,cam)}
tick();
</script></body></html>
